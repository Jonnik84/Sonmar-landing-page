# Оновлює data/catalog.json (серії, моделі, документи) з Directus.
# Токен Directus (лише читання) береться з Bitwarden Secrets Manager (регіон EU) за назвою секрету DIRECTUS_READ_TOKEN.
# Потрібен секрет репозиторію BW_ACCESS_TOKEN — токен machine account Bitwarden з доступом до проєкту з цим секретом.
# Запуск: автоматично кожні 6 годин, вручну (Actions → Sync catalog → Run workflow),
# при зміні скрипта синхронізації або з Directus Flow через repository_dispatch (event_type: directus-update).
name: Sync catalog

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'catalog/**'
      - '.github/workflows/sync-catalog.yml'
  repository_dispatch:
    types: [directus-update]

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install --quiet pillow

      - name: Get Directus token from Bitwarden
        env:
          GH_TOKEN: ${{ github.token }}
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
          BWS_SERVER_URL: https://vault.bitwarden.eu
          SECRET_NAME: DIRECTUS_READ_TOKEN
        run: |
          tag=$(gh release list -R bitwarden/sdk-sm --limit 100 --json tagName \
                --jq '[.[] | select(.tagName | startswith("bws-v"))][0].tagName')
          echo "bws release: $tag"
          gh release download "$tag" -R bitwarden/sdk-sm -p 'bws-x86_64-unknown-linux-gnu-*.zip' -D /tmp/bws
          unzip -q -o /tmp/bws/*.zip -d /tmp/bws && chmod +x /tmp/bws/bws
          secrets=$(/tmp/bws/bws secret list --output json)
          echo "Секрети, доступні machine account: $(echo "$secrets" | jq -r '[.[].key] | join(", ")')"
          token=$(echo "$secrets" | jq -r --arg n "$SECRET_NAME" '[.[] | select(.key == $n)][0].value // empty')
          if [ -z "$token" ]; then
            echo "::error::Секрет $SECRET_NAME не знайдено. Дайте machine account доступ до проєкту з цим секретом."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "DIRECTUS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Sync from Directus
        env:
          DIRECTUS_URL: https://directus.sonmar.com.ua
        run: python3 catalog/sync.py

      - name: Commit changes
        run: |
          git add data/catalog.json images/catalog
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "sonmar-catalog-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update catalog from Directus"
            git push
          fi
