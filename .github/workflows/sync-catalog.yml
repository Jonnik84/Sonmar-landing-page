# Оновлює data/catalog.json (серії, моделі, документи) з Directus.
# Токен Directus (лише читання) береться з Bitwarden Secrets Manager (регіон EU).
# Потрібен секрет репозиторію BW_ACCESS_TOKEN — токен machine account Bitwarden з доступом до секрету нижче.
# Запуск: автоматично кожні 6 годин, вручну (Actions → Sync catalog → Run workflow),
# при зміні скрипта синхронізації або з Directus Flow через repository_dispatch (event_type: directus-update).
name: Sync catalog

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'catalog/**'
      - '.github/workflows/sync-catalog.yml'
  repository_dispatch:
    types: [directus-update]

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install --quiet pillow

      - name: Get Directus token from Bitwarden
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            62b0dcaf-0ea3-4f45-81f5-b4ff00a234f9 > DIRECTUS_TOKEN

      - name: Sync from Directus
        env:
          DIRECTUS_URL: https://directus.sonmar.com.ua
        run: python3 catalog/sync.py

      - name: Commit changes
        run: |
          git add data/catalog.json images/catalog
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "sonmar-catalog-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update catalog from Directus"
            git push
          fi
